- page: '/about'
  title: "About the Population Science Data Commons (PSDC)"
  primaryContentImage: https://raw.githubusercontent.com/CBIIT/datacommons-assets/main/popsci/images/icons/png/homeImageforAboutCard.png
  content:
    - paragraph: "Population science research aims to understand the causes and distribution of cancer in populations, monitor and explain cancer trends across different groups defined by geography or demographics, and support the development and implementation of broad-based interventions.    "
    - paragraph: "     "
    - paragraph: "The PSDC manages, houses, and shares data from various NCI-funded research programs and awards, including the Cancer Epidemiology Cohorts (CECs), supported by the NCI’s Division of Cancer Control and Population Sciences (DCCPS). While the NCI’s CECs have and continue to generate a substantial portion of the NCI’s population science data, other population science grants, projects, and programs funded by the NCI also generate valuable data that can potentially advance science if shared more broadly with the extramural research community. Data types supported by the PSDC include, but are not limited to survey and questionnaire data, biomarker assays, environmental exposure measurements, dietary and anthropometric assessments, and biometrics from exercise-capturing technologies."
    - paragraph: " "
    - paragraph: "In addition to making population science data accessible, the PSDC supports integration with other Cancer Research Data Commons (CRDC) data commons. As part of the CRDC, the PSDC’s data can be linked to -omics data from the same populations stored in other CRDC data commons, such as the Genomics Data Commons, the Proteomic Data Commons, or the General Commons.   "
    - paragraph: " "
    - paragraph: "The PSDC portal currently focuses on comprehensive study data, not individual participant data. Descriptive clinical and demographic summary data are searchable, allowing users to identify studies of potential interest. "
- page: '/access_data'
  title: "Access Data"
  primaryContentImage: https://raw.githubusercontent.com/CBIIT/datacommons-assets/main/popsci/images/icons/png/TrialsImage.png
  content:
    - paragraph: "PSDC hosts both open and controlled access data, accessible for analysis and download through the Seven Bridges Cancer Genomics Cloud"
    - paragraph: "The PSDC portal provides faceted searching for studies of interest using various parameters, including study name, design, enrollment period, number of participants, cancer types, and the presence or absence of demographics such as age at enrollment, race, ethnicity, and sex. "
    - paragraph: "PSDC hosts both open and controlled access data. Open access data is publicly accessible, no authorization is required. To use controlled-access data, researchers must first obtain authorization from the NCI’s Data Access Committee (DAC). The DAC manages the authorization process for the database of Genotypes and Phenotypes (dbGaP), maintained by the National Center for Biotechnology Information (NCBI). Users request access to controlled data through   $$[dbGaP](https://dbgap.ncbi.nlm.nih.gov/home)$$  using the pHS study IDs provided by the PSDC portal."
    - paragraph: "TThe PSDC portal does not provide local file download at this time, however users can navigate from the portal to the Seven Bridges Cancer Genomics Cloud (SB-CGC), powered by Velsera, by adding files of interest to the Data Cart and selecting Export and Download > Export to Cancer Genomics Cloud. Once on SB-CGC, files are accessible to authorized users for analysis or local download."
- page: '/analyze_data'
  title: "Analyze Data"
  primaryContentImage: https://raw.githubusercontent.com/CBIIT/datacommons-assets/main/popsci/images/icons/png/requestAccessImage.png
  content:
     - paragraph: "The Seven Bridges Cancer Genomics Cloud (SB-CGC), powered by Velsera, collaborates with the PSDC to facilitate access to its data for analysis. SB-CGC offers secure personal workspaces on the AWS cloud platform as well as publicly available analytical tools shared by the research community. Users create a manifest of files of interest through the PSDC portal and, with one click, can access those files for analysis within the secure SB-CGC environment. Users also have the option of downloading data to their local environment from the SB-CGC platform.  Learn more about working within the $$[Seven Bridges Cancer Genomics Cloud](https://datacommons.cancer.gov/analytical-resource/seven-bridges-cancer-genomics-cloud-developed-velsera#)$$(SB-CGC) environment." 
